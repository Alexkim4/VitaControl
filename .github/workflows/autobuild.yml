name: Build VitaControl

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Build with VitaSDK Docker
      run: |
        docker run --rm -v ${{ github.workspace }}:/work -w /work vitasdk/vitasdk:latest bash -c "
          vdpm taihen &&
          mkdir -p build &&
          cd build &&
          cmake .. &&
          make -j\$(nproc) &&
          chmod 777 vitacontrol.skprx
        "

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: vitacontrol
        path: build/vitacontrol.skprx
